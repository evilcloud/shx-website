<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>SHX.COM</title>

  <style>
    :root {
      --paper: #ebe8df;
      --paper-2: #ded9cc;
      --ink: #050505;
      --white: #f2efe7;
      --muted: rgba(5, 5, 5, 0.58);
      --hair-white: rgba(242, 239, 231, 0.32);

      --outer: clamp(10px, 1.8vw, 30px);
      --rule: clamp(4px, 0.65vw, 7px);

      --display:
        "Arial Black",
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      --sans:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      --mono:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--paper);
    }

    body {
      margin: 0;
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      overflow-x: hidden;
      overflow-y: auto;
    }

    .site {
      width: 100%;
      min-height: 100svh;
      padding: var(--outer);
      background:
        linear-gradient(90deg, rgba(5, 5, 5, 0.028) 1px, transparent 1px),
        linear-gradient(180deg, #f1eee6 0%, var(--paper) 46%, var(--paper-2) 100%);
      background-size: 56px 56px, 100% 100%;
      overflow-x: clip;
    }

    .frame {
      width: 100%;
      min-height: calc(100svh - (var(--outer) * 2));
      border: var(--rule) solid var(--ink);
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: rgba(235, 232, 223, 0.74);
      overflow: hidden;
    }

    .topbar,
    .footer {
      font-family: var(--mono);
      font-size: clamp(10px, 0.86vw, 13px);
      line-height: 1;
      letter-spacing: 0.025em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: clamp(10px, 1.6vw, 22px);
      align-items: center;
      border-bottom: var(--rule) solid var(--ink);
      padding: 10px clamp(10px, 1.4vw, 18px) 9px;
    }

    .topbar span {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .topbar span:nth-child(2) {
      color: var(--ink);
      font-weight: 800;
      text-align: center;
    }

    .topbar span:last-child {
      text-align: right;
    }

    .body {
      min-width: 0;
      display: grid;
      grid-template-rows: minmax(190px, 41svh) auto;
    }

    .masthead {
      min-width: 0;
      display: flex;
      align-items: end;
      padding:
        clamp(34px, 7vh, 86px)
        clamp(12px, 2vw, 30px)
        0;
      overflow: hidden;
    }

    .masthead h1 {
      margin: 0;
      max-width: 100%;
      font-family: var(--display);
      font-size: clamp(58px, 18.1vw, 310px);
      line-height: 0.735;
      font-weight: 950;
      letter-spacing: -0.052em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .panel {
      min-width: 0;
      width: 100%;
      background: var(--ink);
      color: var(--white);
      border-top: var(--rule) solid var(--ink);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(210px, 310px);
      gap: clamp(30px, 5vw, 76px);
      padding:
        clamp(34px, 6vh, 78px)
        clamp(22px, 5vw, 78px)
        calc(clamp(42px, 7vh, 90px) + env(safe-area-inset-bottom));
    }

    .panel > * {
      min-width: 0;
    }

    .statement {
      max-width: 960px;
    }

    .statement p {
      margin: 0;
      max-width: 18ch;
      font-family: var(--sans);
      font-size: clamp(28px, 4vw, 74px);
      line-height: 0.99;
      font-weight: 900;
      letter-spacing: 0.014em;
      text-transform: uppercase;
      text-wrap: balance;
    }

    .statement p:first-child {
      max-width: 15ch;
      font-size: clamp(34px, 4.75vw, 88px);
      line-height: 0.94;
      letter-spacing: 0.006em;
    }

    .statement p + p {
      margin-top: clamp(22px, 4vh, 48px);
      padding-top: clamp(20px, 3.3vh, 38px);
      border-top: 2px solid rgba(242, 239, 231, 0.72);
    }

    .statement p:nth-child(2) {
      max-width: 21ch;
    }

    .statement p:nth-child(3) {
      max-width: 16ch;
    }

    .audit {
      align-self: stretch;
      display: flex;
      align-items: end;
      border-left: 2px solid var(--hair-white);
      padding-left: clamp(18px, 2.25vw, 32px);
    }

    .audit dl {
      width: 100%;
      margin: 0;
      font-family: var(--mono);
      font-size: clamp(10px, 0.86vw, 13px);
      line-height: 1.34;
      letter-spacing: 0.015em;
      text-transform: uppercase;
    }

    .audit div {
      display: grid;
      grid-template-columns: 8.5ch minmax(0, 1fr);
      gap: 16px;
      padding: 9px 0;
      border-top: 1px solid rgba(242, 239, 231, 0.25);
    }

    .audit dt {
      color: rgba(242, 239, 231, 0.42);
    }

    .audit dd {
      margin: 0;
      color: rgba(242, 239, 231, 0.88);
      text-align: right;
      overflow-wrap: anywhere;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      border-top: var(--rule) solid var(--ink);
      padding: 10px clamp(10px, 1.4vw, 18px) 9px;
    }

    .footer span {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      opacity: 0.04;
      mix-blend-mode: multiply;
      background-image:
        repeating-radial-gradient(
          circle at 17% 23%,
          #000 0,
          #000 0.8px,
          transparent 1.2px,
          transparent 3px
        );
    }

    @media (max-width: 1080px) {
      .panel {
        grid-template-columns: 1fr;
        gap: 40px;
      }

      .audit {
        border-left: 0;
        border-top: 2px solid var(--hair-white);
        padding-left: 0;
        padding-top: 16px;
      }
    }

    @media (max-width: 720px) {
      :root {
        --outer: 0px;
        --rule: 5px;
      }

      .site {
        min-height: 100svh;
        padding: 0;
        background: var(--paper);
      }

      .frame {
        min-height: 100svh;
        border: 0;
        grid-template-rows: auto 1fr auto;
        background: var(--paper);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-bottom: var(--rule) solid var(--ink);
        padding:
          calc(12px + env(safe-area-inset-top))
          12px
          11px;
        font-size: 10px;
      }

      .topbar span:first-child {
        display: none;
      }

      .topbar span:nth-child(2) {
        text-align: left;
      }

      .topbar span:last-child {
        display: block;
        text-align: right;
        color: var(--muted);
      }

      .body {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
      }

      .masthead {
        min-height: 30svh;
        align-items: end;
        padding:
          clamp(54px, 12svh, 96px)
          12px
          10px;
        background:
          linear-gradient(90deg, rgba(5, 5, 5, 0.035) 1px, transparent 1px),
          var(--paper);
        background-size: 42px 42px;
      }

      .masthead h1 {
        font-size: clamp(55px, 20vw, 88px);
        line-height: 0.86;
        letter-spacing: -0.04em;
      }

      .panel {
        display: block;
        min-height: 0;
        border-top: var(--rule) solid var(--ink);
        padding:
          30px
          18px
          calc(34px + env(safe-area-inset-bottom));
      }

      .statement {
        max-width: none;
      }

      .statement p {
        max-width: 14.5ch;
        font-size: clamp(25px, 7.15vw, 38px);
        line-height: 1.02;
        font-weight: 900;
        letter-spacing: 0.006em;
      }

      .statement p:first-child {
        max-width: 12ch;
        font-size: clamp(31px, 8.8vw, 46px);
        line-height: 0.97;
      }

      .statement p + p {
        margin-top: 22px;
        padding-top: 20px;
        border-top: 2px solid rgba(242, 239, 231, 0.68);
      }

      .statement p:nth-child(2) {
        max-width: 17ch;
      }

      .statement p:nth-child(3) {
        max-width: 13ch;
      }

      .audit {
        margin-top: 34px;
        padding-top: 13px;
        border-top: 2px solid var(--hair-white);
        border-left: 0;
        padding-left: 0;
        display: block;
      }

      .audit dl {
        font-size: 10px;
        line-height: 1.22;
      }

      .audit div {
        grid-template-columns: 7.5ch minmax(0, 1fr);
        gap: 12px;
        padding: 7px 0;
      }

      .footer {
        border-top: var(--rule) solid var(--ink);
        padding:
          10px
          12px
          calc(11px + env(safe-area-inset-bottom));
        display: block;
        font-size: 10px;
        line-height: 1.25;
      }

      .footer span {
        display: block;
        white-space: normal;
      }

      .footer span + span {
        margin-top: 3px;
      }

      .grain {
        opacity: 0.035;
      }
    }

    @media (max-width: 380px) {
      .masthead h1 {
        font-size: clamp(49px, 19.3vw, 73px);
        letter-spacing: -0.035em;
      }

      .statement p {
        font-size: clamp(23px, 6.8vw, 32px);
      }

      .statement p:first-child {
        font-size: clamp(29px, 8.3vw, 39px);
      }
    }
  </style>
</head>

<body>
  <main class="site" aria-label="SHX.COM">
    <div class="frame">
      <header class="topbar">
        <span>private surface / public address</span>
        <span>SHX.COM</span>
        <span>occupied / not available</span>
      </header>

      <div class="body">
        <section class="masthead" aria-hidden="true">
          <h1>SHX.COM</h1>
        </section>

        <section class="panel">
          <div class="statement">
            <p>This is not a website.</p>
            <p>It is the public surface of a private domain.</p>
            <p>The domain is not for sale.</p>
          </div>

          <aside class="audit" aria-label="site audit">
            <dl>
              <div>
                <dt>domain</dt>
                <dd>shx.com</dd>
              </div>
              <div>
                <dt>status</dt>
                <dd>occupied</dd>
              </div>
              <div>
                <dt>sale</dt>
                <dd>no</dd>
              </div>
              <div>
                <dt>stack</dt>
                <dd>static</dd>
              </div>
              <div>
                <dt>contact</dt>
                <dd>absent</dd>
              </div>
            </dl>
          </aside>
        </section>
      </div>

      <footer class="footer">
        <span>absence is not vacancy</span>
        <span>silence is not availability</span>
      </footer>
    </div>

    <div class="grain"></div>
  </main>
</body>
</html>
